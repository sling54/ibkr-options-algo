[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-options-algo"
version = "0.2.0"
description = "Options premium-selling pipeline for an Interactive Brokers paper account"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "ib_async==2.1.0",
    "pydantic==2.14.4",
    "tomli==2.2.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[project.scripts]
ibkr-algo = "ibkr_options_algo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibkr_options_algo = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "PTH",      # pathlib
    "RUF",      # ruff-specific
    "N",        # naming
    "PL",       # pylint subset
]
ignore = [
    "PLR0913",  # many arguments: report/row builders mirror the data they carry
    "PLR0917",  # many positional arguments: same reason
    "PLR2004",  # magic-value comparison: flagged on test assertions and enum-like literals
]

[tool.ruff.lint.per-file-ignores]
# The fake broker mirrors ib_async's camelCase method and argument names.
"tests/**" = ["PLR0915", "PLC0415", "N802", "N803"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["ibkr_options_algo"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

# tomli is only installed (and imported) on Python 3.10.
[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

# The pure layers carry no I/O, so hold them to the strictest standard.
[[tool.mypy.overrides]]
module = [
    "ibkr_options_algo.calculations",
    "ibkr_options_algo.config",
    "ibkr_options_algo.errors",
    "ibkr_options_algo.models",
    "ibkr_options_algo.reporting",
    "ibkr_options_algo.risk",
    "ibkr_options_algo.strategy",
]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
log_level = "INFO"
